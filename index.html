function saveFocus(){
    const el=document.activeElement;
    if(!el||el===document.body)return null;
    const i={id:el.id};
    if(el.selectionStart!==undefined){i.ss=el.selectionStart;i.se=el.selectionEnd}
    return i;
}
function restoreFocus(i){
    if(!i||!i.id)return;
    const el=document.getElementById(i.id);
    if(!el)return;
    el.focus();
    if(i.ss!==undefined&&el.setSelectionRange){try{el.setSelectionRange(i.ss,i.se)}catch(e){}}
}

async function fetchRates(){
    state.loading=true; render();
    try{
        const r=await fetch("https://api.exchangerate-api.com/v4/latest/USD");
        if(!r.ok)throw new Error();
        const d=await r.json();
        state.rates=d.rates; state.error=null;
    }catch{state.error=t("loadError")}
    finally{state.loading=false;render()}
}

function doConvert(){
    if(!state.rates)return;
    const n=parseFloat(state.amount);
    if(isNaN(n)||n<=0){state.error=t("inputError");state.result=null;render();return}
    if(!state.rates[state.fromCurrency]||!state.rates[state.toCurrency]){state.error=t("invalidCurrency");state.result=null;render();return}
    const v=(n/state.rates[state.fromCurrency])*state.rates[state.toCurrency];
    state.result=`${n.toLocaleString()} ${state.fromCurrency} = ${v.toLocaleString(undefined,{maximumFractionDigits:4})} ${state.toCurrency}`;
    state.error=null; state.animateResult=true; render();
    setTimeout(()=>{state.animateResult=false;render()},600);
}

function swap(){
    [state.fromCurrency,state.toCurrency]=[state.toCurrency,state.fromCurrency];
    saveFrom();saveTo();
    if(state.result)doConvert();else render();
}

function toggleFav(code){
    if(state.favorites.includes(code))state.favorites=state.favorites.filter(c=>c!==code);
    else state.favorites.push(code);
    saveFav();
    const f=saveFocus();render();restoreFocus(f);
}

function sortFav(arr){
    return[...arr].sort((a,b)=>{
        const af=state.favorites.includes(a)?0:1;
        const bf=state.favorites.includes(b)?0:1;
        if(af!==bf)return af-bf;
        return a.localeCompare(b);
    });
}

function getList(){
    if(!state.rates)return[];
    const all=Object.keys(state.rates);
    let f;
    if(state.activeTab==="popular")f=all.filter(c=>POPULAR.includes(c));
    else if(state.active==="favorites")f=all.filter(c=>state.favorites.includes(c));
    else{const q=state.listSearchQuery.toLowerCase();f=all.filter(c=>c.toLowerCase().includes(q)||getName(c).toLowerCase().includes(q))}
    return sortFav(f);
}

function getDropList(){
    if(!state.rates)return[];
    const all=Object.keys(state.rates);
    const q=state.searchQuery.toLowerCase();
    return sortFav(all.filter(c=>c.toLowerCase().includes(q)||getName(c).toLowerCase().includes(q)));
}

function render(){
    const fi=saveFocus();
    const list=getList();

    document.getElementById("app").innerHTML=`
    <div class="min-h-screen bg-gradient-to-br from-sky-50 via-blue-50 to-indigo-50 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-96 h-96 bg-gradient-to-br from-sky-200/40 to-transparent rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-tl from-indigo-200/40 to-transparent rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>
        <div class="relative z-10 max-w-6xl mx-auto px-4 py-8 min-h-screen flex flex-col">

            <header class="flex items-center justify-between mb-8 flex-wrap gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black bg-gradient-to-r from-sky-700 to-blue-600 bg-clip-text text-transparent">${t("title")}</h1>
                    <p class="text-slate-500 mt-1 text-sm md:text-base">${t("subtitle")}</p>
                </div>
                <div class="flex items-center gap-2 bg-white/70 backdrop-blur-sm rounded-full p-1.5 shadow-lg border border-white/80">
                    <button onclick="setLang('ru')" class="px-4 py-2 rounded-full text-sm font-bold transition-all ${state.lang==='ru'?'bg-gradient-to-r from-sky-500 to-blue-500 text-white shadow-md':'text-slate-500 hover:text-sky-600'}">RU</button>
                    <button onclick="setLang('en')" class="px-4 py-2 rounded-full text-sm font-bold transition-all ${state.lang==='en'?'bg-gradient-to-r from-sky-500 to-blue-500 text-white shadow-md':'text-slate-500 hover:text-sky-600'}">EN</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 flex-1">
                <div class="lg:col-span-3">
                    <div class="bg-white/70 backdrop-blur-xl border border-white/80 rounded-3xl shadow-xl p-6 md:p-8">
                        <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <span class="w-8 h-8 bg-gradient-to-br from-sky-400 to-blue-500 rounded-lg flex items-center justify-center text-white text-sm">💱</span>
                            ${t("converterTitle")}
                        </h2>

                        <div class="mb-6">
                            <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">${t("amount")}</label>
                            <div class="relative">
                                <input id="input-amount" type="number" value="${state.amount}" oninput="state.amount=this.value" placeholder="${t("amountPlaceholder")}" class="w-full px-5 py-4 bg-white/80 border-2 border-sky-100 rounded-2xl text-xl font-bold text-slate-800 focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition-all placeholder:text-slate-300"/>
                                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-2xl">${getFlag(state.fromCurrency)}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-4 items-end mb-6">
                            <div class="relative">
                                <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">${t("from")}</label>
                                <button onclick="toggleDrop('from')" class="w-full flex items-center gap-3 px-5 py-4 bg-white/80 border-2 ${state.openDropdown==='from'?'border-sky-400 ring-4 ring-sky-100':'border-sky-100'} rounded-2xl hover:border-sky-300 hover:shadow-lg transition-all">
                                    <span class="text-3xl">${getFlag(state.fromCurrency)}</span>
                                    <div class="flex-1 text-left">
                                        <div class="font-bold text-slate-800 text-lg">${state.fromCurrency}</div>
                                        <div class="text-sm text-slate-500 truncate">${getName(state.fromCurrency)}</div>
                                    </div>
                                    <svg class="w-5 h-5 text-slate-400 transition-transform ${state.openDropdown==='from'?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                ${state.openDropdown==='from'?renderDrop('from'):''}
                            </div>

                            <button onclick="swap()" class="w-14 h-14 mx-auto bg-gradient-to-br from-sky-400 to-blue-600 rounded-2xl text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all" title="${t("swap")}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                            </button>

                            <div class="relative">
                                <label class="block text-sm font-semibold text-slate-600 mb-2 ml-1">${t("to")}</label>
                                <button onclick="toggleDrop('to')" class="w-full flex items-center gap-3 px-5 py-4 bg-white/80 border-2 ${state.openDropdown==='to'?'border-sky-400 ring-4 ring-sky-100':'border-sky-100'} rounded-2xl hover:border-sky-300 hover:shadow-lg transition-all">
                                    <span class="text-3xl">${getFlag(state.toCurrency)}</span>
                                    <div class="flex-1 text-left">
                                        <div class="font-bold text-slate-800 text-lg">${state.toCurrency}</div>
                                        <div class="text-sm text-slate-500 truncate">${getName(state.toCurrency)}</div>
                                    </div>
                                    <svg class="w-5 h-5 text-slate-400 transition-transform ${state.openDropdown==='to'?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                ${state.openDropdown==='to'?renderDrop('to'):''}
                            </div>
                        </div>

                        <button onclick="doConvert()" class="w-full py-4 bg-gradient-to-r from-sky-500 via-blue-500 to-indigo-500 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all">
                            ${t("convert")}
                        </button>

                        ${state.result?`<div class="mt-6 p-5 bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 rounded-2xl text-center ${state.animateResult?'result-pop':''}">
                            <div class="text-sm font-medium text-emerald-600 mb-1">${t("result")}</div>
                            <div class="text-xl font-black text-emerald-800">${state.result}</div>
                            ${state.rates?`<div class="text-sm text-emerald-600/70 mt-2">${t("rate")}: 1 ${state.fromCurrency} = ${(state.rates[state.toCurrency]/state.rates[state.fromCurrency]).toFixed(4)} ${state.toCurrency}</div>`:''}
                        </div>`:''}

                        ${state.error?`<div class="mt-6 p-5 bg-gradient-to-r from-red-50 to-rose-50 border border-red-200 rounded-2xl text-center">
                            <div class="text-sm font-medium text-red-500 mb-1">${t("error")}</div>
                            <div class="text-red-700 font-bold">${state.error}</div>
                        </div>`:''}

                        ${state.loading?`<div class="mt-6 p-5 bg-sky-50/50 border border-sky-100 rounded-2xl text-center">
                            <div class="flex items-center justify-center gap-2">
                                <div class="w-5 h-5 border-2 border-sky-300 border-t-sky-600 rounded-full animate-spin"></div>
                                <span class="text-sky-600 font-medium">${t("loading")}</span>
                            </div>
                        </div>`:''}
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="bg-white/70 backdrop-blur-xl border border-white/80 rounded-3xl shadow-xl p-6 h-full flex flex-col">
                        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <span class="w-8 h-8 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-lg flex items-center justify-center text-white text-sm">📋</span>
                            ${t("listTitle")}
                        </h2>

                        <div class="flex gap-1 bg-sky-50/50 rounded-xl p-1 mb-4">
                            <button onclick="setTab('popular')" class="flex-1 py-2 px-3 rounded-lg text-xs font-bold transition-all ${state.activeTab==='popular'?'bg-white shadow-md text-sky-700':'text-slate-500 hover:text-sky-600'}">${t("popular")}</button>
                            <button onclick="setTab('favorites')" class="flex-1 py-2 px-3 rounded-lg text-xs font-bold transition-all ${state.activeTab==='favorites'?'bg-white shadow-md text-amber-600':'text-slate-500 hover:text-amber-500'}">★ ${t("favorites")}</button>
                            <button onclick="setTab('all')" class="flex-1 py-2 px-3 rounded-lg text-xs font-bold transition-all ${state.activeTab==='all'?'bg-white shadow-md text-slate-700':'text-slate-500 hover:text-slate-700'}">${t("all")}</button>
                        </div>

                        ${state.activeTab==='all'?`<div class="mb-4 relative">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input id="input-list-search" type="text" placeholder="${t("searchPlaceholder")}" value="${state.listSearchQuery}" oninput="onListSearch(this)" class="w-full pl-10 pr-4 py-3 bg-sky-50/50 border border-sky-100 rounded-xl text-sm focus:outline-none focus:border-sky-300 focus:ring-2 focus:ring-sky-100 transition-all"/>
                        </div>`:''}

                        <div id="currency-list" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[500px] scrollbar-thin">
                            ${list.length===0?`<div class="text-center py-12 text-slate-400"><div class="text-4xl mb-2">🔍</div><div class="text-sm">${t("noResults")}</div></div>`:''}
                            ${list.map(c=>{
                                const fav=state.favorites.includes(c);
                                return `<div class="flex items-center gap-3 p-3 rounded-xl border transition-all cursor-pointer hover:shadow-md ${fav?'bg-gradient-to-r from-amber-50/50 to-yellow-50/50 border-amber-200/60 hover:border-amber-300':'bg-white/50 border-sky-50 hover:border-sky-200 hover:bg-sky-50/30'}" onclick="pickFromList('${c}')">
                                    <span class="text-2xl">${getFlag(c)}</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2">
                                            <span class="font-bold text-slate-800 text-sm">${c}</span>
                                            ${fav?'<span class="text-amber-400 text-xs">★</span>':''}
                                        </div>
                                        <div class="text-xs text-slate-500 truncate">${getName(c)}</div>
                                    </div>
                                    ${state.rates&&state.rates[c]?`<div class="text-right hidden sm:block"><div class="text-xs font-semibold text-slate-600">${state.rates[c]<1?state.rates[c].toFixed(6):state.rates[c].toFixed(2)}</div><div class="text-[10px] text-slate-400">${t("perUnit")}</div></div>`:''}
                                    <button onclick="event.stopPropagation();toggleFav('${c}')" class="text-lg transition-all ${fav?'text-amber-400 scale-110':'text-slate-300 hover:text-amber-300 hover:scale-110'}">★</button>
                                </div>`;
                            }).join('')}
                        </div>

                        <div class="mt-4 pt-4 border-t border-sky-100/50">
                            <p class="text-xs text-slate-400 text-center">${t("hint")}</p>
                            <p class="text-xs text-slate-400/70 text-center mt-1">${t("smallHint")}</p>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-8 text-center">
                <div class="inline-flex items-center gap-2 px-6 py-3 bg-white/50 backdrop-blur-sm rounded-full border border-white/60 shadow-sm">
                    <span class="text-sm font-bold text-slate-500">${t("developer")}</span>
                    <span class="text-slate-300">•</span>
                    <span class="text-sm text-slate-400">${t("lastUpdated")}: ${t("today")}</span>
                </div>
            </footer>
        </div>
    </div>`;
    restoreFocus(fi);
}

function renderDrop(type){
    const list=getDropList();
    const cur=type==='from'?state.fromCurrency:state.toCurrency;
    const sid=type==='from'?'input-drop-from':'input-drop-to';
    return `<div class="absolute z-50 top-full left-0 right-0 mt-2 bg-white/95 backdrop-blur-xl border border-sky-100 rounded-2xl shadow-2xl overflow-hidden dropdown-enter">
        <div class="p-3 border-b border-sky-50">
            <input id="${sid}" type="text" placeholder="${t("searchPlaceholder")}" value="${state.searchQuery}" oninput="onDropSearch(this)" class="w-full px-4 py-2.5 bg-sky-50/50 border border-sky-100 rounded-xl text-sm focus:outline-none focus:border-sky-300 focus:ring-2 focus:ring-sky-100"/>
        </div>
        <div id="drop-list-${type}" class="max-h-72 overflow-y-auto p-2 scrollbar-thin">
            ${list.length===0?`<div class="text-center py-6 text-slate-400 text-sm">${t("noResults")}</div>`:''}
            ${list.map(c=>`
                <button onclick="pickDrop('${type}','${c}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${cur===c?'bg-gradient-to-r from-sky-50 to-blue-50 border border-sky-200':'hover:bg-sky-50/50'}">
                    <span class="text-2xl">${getFlag(c)}</span>
                    <div class="flex-1 text-left">
                        <span class="font-bold text-slate-800">${c}</span>
                        <span class="text-slate-500 text-sm ml-2">${getName(c)}</span>
                        ${state.favorites.includes(c)?'<span class="text-amber-400 text-xs ml-1">★</span>':''}
                    </div>
                    <button onclick="event.stopPropagation();toggleFav('${c}')" class="text-xl transition-all ${state.favorites.includes(c)?'text-amber-400 scale-110':'text-slate-300 hover:text-amber-300'}">★</button>
                </button>
            `).join('')}
        </div>
    </div>`;
}

function onListSearch(el){state.listSearchQuery=el.value;updateList()}
function onDropSearch(el){state.searchQuery=el.value;updateDrop()}

function updateList(){
    const list=getList();
    const c=document.getElementById('currency-list');
    if(!c)return;
    c.innerHTML=list.length===0
        ?`<div class="text-center py-12 text-slate-400"><div class="text-4xl mb-2">🔍</div><div class="text-sm">${t("noResults")}</div></div>`
        :list.map(c=>{
            const fav=state.favorites.includes(c);
            return `<div class="flex items-center gap-3 p-3 rounded-xl border transition-all cursor-pointer hover:shadow-md ${fav?'bg-gradient-to-r from-amber-50/50 to-yellow-50/50 border-amber-200/60 hover:border-amber-300':'bg-white/50 border-sky-50 hover:border-sky-200 hover:bg-sky-50/30'}" onclick="pickFromList('${c}')">
                <span class="text-2xl">${getFlag(c)}</span>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2"><span class="font-bold text-slate-800 text-sm">${c}</span>${fav?'<span class="text-amber-400 text-xs">★</span>':''}</div>
                    <div class="text-xs text-slate-500 truncate">${getName(c)}</div>
                </div>
                ${state.rates&&state.rates[c]?`<div class="text-right hidden sm:block"><div class="text-xs font-semibold text-slate-600">${state.rates[c]<1?state.rates[c].toFixed(6):state.rates[c].toFixed(2)}</div><div class="text-[10px] text-slate-400">${t("perUnit")}</div></div>`:''}
                <button onclick="event.stopPropagation();toggleFav('${c}')" class="text-lg transition-all ${fav?'text-amber-400 scale-110':'text-slate-300 hover:text-amber-300 hover:scale-110'}">★</button>
            </div>`;
        }).join('');
}

function updateDrop(){
    const list=getDropList();
    const type=state.openDropdown;
    if(!type)return;
    const cur=type==='from'?state.fromCurrency:state.toCurrency;
    const c=document.getElementById('drop-list-'+type);
    if(!c)return;
    c.innerHTML=list.length===0
        ?`<div class="text-center py-6 text-slate-400 text-sm">${t("noResults")}</div>`
        :list.map(code=>`
            <button onclick="pickDrop('${type}','${code}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${cur===code?'bg-gradient-to-r from-sky-50 to-blue-50 border border-sky-200':'hover:bg-sky-50/50'}">
                <span class="text-2xl">${getFlag(code)}</span>
                <div class="flex-1 text-left">
                    <span class="font-bold text-slate-800">${code}</span>
                    <span class="text-slate-500 text-sm ml-2">${getName(code)}</span>
                    ${state.favorites.includes(code)?'<span class="text-amber-400 text-xs ml-1">★</span>':''}
                </div>
                <button onclick="event.stopPropagation();toggleFav('${code}')" class="text-xl transition-all ${state.favorites.includes(code)?'text-amber-400 scale-110':'text-slate-300 hover:text-amber-300'}">★</button>
            </button>
        `).join('');
}

function setLang(l){state.lang=l;saveLang();render()}
function setTab(t){state.activeTab=t;render()}
function toggleDrop(type){
    state.openDropdown=state.openDropdown===type?null:type;
    state.searchQuery="";
    render();
}
function pickDrop(type,code){
    if(type==='from'){state.fromCurrency=code;saveFrom()}
    else{state.toCurrency=code;saveTo()}
    state.openDropdown=null;state.searchQuery="";
    render();
}
function pickFromList(code){
    state.fromCurrency=code;saveFrom();render();
}

document.addEventListener("click",(e)=>{
    if(state.openDropdown){
        const t=e.target;
        const drops=document.querySelectorAll('.dropdown-enter');
        const btns=document.querySelectorAll('[onclick*="toggleDrop"]');
        let inside=false;
        drops.forEach(d=>{if(d.contains(t))inside=true});
        btns.forEach(b=>{if(b.contains(t))inside=true});
        if(!inside){state.openDropdown=null;state.searchQuery="";render()}
    }
});

render();
fetchRates();
</script>
</body>
</html>
